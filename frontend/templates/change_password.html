{% extends "base.html" %}

{% block title %}Passwort ändern{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <h2 class="mb-4 text-center">Passwort ändern</h2>

    {% if error %}
        <div class="alert alert-danger" role="alert">
            {{ error }}
        </div>
    {% endif %}
    {% if success %}
        <div class="alert alert-success" role="alert">
            {{ success }}
        </div>
    {% endif %}

    <form method="post" action="/change/password">
        <div class="form-group mb-3">
            <label for="username">Benutzername</label>
            <input type="text" class="form-control" id="username" name="username" required placeholder="z. B. maxmuster">
        </div>

        <div class="form-group mb-3">
            <label for="old_password">Aktuelles Passwort</label>
            <input type="password" class="form-control" id="old_password" name="old_password" required>
        </div>

        <div class="form-group mb-3">
            <label for="new_password">Neues Passwort</label>
            <input type="password" class="form-control" id="new_password" name="new_password" required>
        </div>

        <div class="form-group mb-4">
            <label for="confirm_password">Neues Passwort wiederholen</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Passwort ändern</button>
    </form>

        <!-- {% if user.role == 'admin' %}
            <a href="/admin/dashboard" class="btn btn-secondary w-100">Zurück zum Admin-Dashboard</a>
        {% elif user.role == "professor" %}
            <a href="/professor/classes" class="btn btn-secondary w-100">Zurück zur Professorenübersicht</a>
        {% elif user.role == "student" %}
            <a href="/classes" class="btn btn-secondary w-100">Zurück zu meinen Kursen</a>
            
         {% endif %} -->
    
</div>
{% endblock %}
