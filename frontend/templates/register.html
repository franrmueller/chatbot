{% extends "base.html" %}

{% block title %}
Registrieren - Vorlesungschatbot
{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Studierenden-Registrierung</h1>

    <!-- Error message shown on registration failure -->
    <div class="error-message" id="error-message" style="display: none;"></div>

    <!-- Registration form -->
    <form id="register-form" class="auth-form">

        <!-- Username field -->
        <div class="form-group">
            <label for="username">Benutzername:</label>
            <input type="text" id="username" name="username" required>
        </div>

        <!-- Course selection, loaded dynamically via JavaScript -->
        <div class="form-group">
            <label for="course">Kurs auswählen:</label>
            <select id="course" name="course" required>
                <option value="" disabled selected>Bitte wählen Sie einen Kurs</option>
                <!-- Kurse werden per JS geladen -->
            </select>
        </div>

        <!-- Password and confirmation fields -->
        <div class="form-group">
            <label for="password">Passwort:</label>
            <input type="password" id="password" name="password" required minlength="8">
        </div>

        <div class="form-group">
            <label for="confirm-password">Passwort bestätigen:</label>
            <input type="password" id="confirm-password" name="confirm-password" required minlength="8">
        </div>

        <!-- Security question for password recovery -->
        <!-- <h3>Sicherheitsfrage</h3> -->
        <!-- <p class="form-info">Wähle eine Sicherheitsfrage und gib die Antwort ein. Diese wird verwendet, um dein Passwort zurückzusetzen.</p>

        <div class="form-group">
            <label for="security-question">Frage auswählen:</label>
            <select id="security-question" name="security-question" class="form-control" required>
                <option value="" disabled selected>Bitte wähle eine Frage</option>
                <option value="first_pet">Was ist der Name deines ersten Haustiers?</option>
                <option value="birth_city">In welcher Stadt bist du geboren?</option>
                <option value="mother_maiden">Wie lautet der Mädchenname deiner Mutter?</option>
            </select>
        </div>

        <div class="form-group">
            <label for="security-answer">Deine Antwort:</label>
            <input type="text" id="security-answer" name="security-answer" class="form-control" required placeholder="Antwort eingeben">
        </div> -->

        <!-- Submit button -->
        <button type="submit" class="btn btn-primary">Registrieren</button>
    </form>

    <div class="auth-links">
        <!-- Link to login if already registered -->
        <p>Bereits ein Konto? <a href="/login">Anmelden</a></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Load available courses from backend and populate select box
    document.addEventListener('DOMContentLoaded', async function () {
        try {
            const response = await fetch('/api/courses');
            const data = await response.json();
            const courseSelect = document.getElementById('course');
            data.courses.forEach(course => {
                const option = document.createElement('option');
                option.value = course.id;
                option.textContent = course.name;
                courseSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Fehler beim Laden der Kurse:', error);
        }
    });

    // Handle registration form submission
    document.getElementById('register-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const errorMessage = document.getElementById('error-message');

        // Check if passwords match
        if (password !== confirmPassword) {
            errorMessage.textContent = 'Passwörter stimmen nicht überein.';
            errorMessage.style.display = 'block';
            return;
        }

        const userData = {
            first_name: document.getElementById('first-name').value,
            last_name: document.getElementById('last-name').value,
            username: document.getElementById('username').value,
            password: password,
            course_id: document.getElementById('course').value,
            role: "student", 
            security_question: document.getElementById('security-question').value,
            security_answer: document.getElementById('security-answer').value

        };

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });

            const data = await response.json();

            if (!response.ok) {
                errorMessage.textContent = data.detail || 'Registrierung fehlgeschlagen. Bitte versuchen Sie es erneut.';
                errorMessage.style.display = 'block';
                return;
            }
            
            // Redirect to login page with success flag
            window.location.href = '/login?registered=true';

        } catch (error) {
            errorMessage.textContent = 'Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.';
            errorMessage.style.display = 'block';
            console.error('Registrierungsfehler:', error);
        }
    });
</script>
{% endblock %}
