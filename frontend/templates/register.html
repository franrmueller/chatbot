{% extends "base.html" %}

{% block title %}
Registrieren - Vorlesungschatbot
{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Studierenden-Registrierung</h1>

    <!-- Error message display -->
    <div class="error-message" id="error-message" style="display: none;"></div>

    <!-- Registration form -->
    <form id="register-form" class="auth-form">

        <!-- <div class="form-group">
            <label for="first-name">Vorname:</label>
            <input type="text" id="first-name" name="first-name" required>
        </div>

        <div class="form-group">
            <label for="last-name">Nachname:</label>
            <input type="text" id="last-name" name="last-name" required>
        </div> -->

        <!-- Username input -->
        <div class="form-group">
            <label for="username">Benutzername:</label>
            <input type="text" id="username" name="username" required>
        </div>

        <!-- Course selection (populated via JavaScript) -->
        <div class="form-group">
            <label for="course">Kurs auswählen:</label>
            <select id="course" name="course" required>
                <option value="" disabled selected>Bitte wählen Sie einen Kurs</option>
                <!-- Kurse werden per JS geladen -->
            </select>
        </div>
        <!-- Password input -->
        <div class="form-group">
            <label for="password">Passwort:</label>
            <input type="password" id="password" name="password" required minlength="8">
            <small class="form-info">Mindestens 8 Zeichen und ein Symbol erforderlich</small>
        </div>
        <!-- Password confirmation -->
        <div class="form-group">
            <label for="confirm-password">Passwort bestätigen:</label>
            <input type="password" id="confirm-password" name="confirm-password" required minlength="8">
        </div>

        <!-- Submit button -->
        <button type="submit" class="btn btn-primary">Registrieren</button>
    </form>
<!-- Link to login page -->
    <div class="auth-links">
        <p>Bereits ein Konto? <a href="/login">Anmelden</a></p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Load course list from backend on page load
    document.addEventListener('DOMContentLoaded', async function () {
        try {
            const response = await fetch('/api/courses');
            const data = await response.json();
            const courseSelect = document.getElementById('course');
            data.courses.forEach(course => {
                const option = document.createElement('option');
                option.value = course.id;
                option.textContent = course.name;
                courseSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Fehler beim Laden der Kurse:', error);
        }
    });

    // // Handle form submission
    document.getElementById('register-form').addEventListener('submit', async function (e) {
        e.preventDefault();

        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm-password').value;
        const errorMessage = document.getElementById('error-message');

        // Password must be at least 8 characters
        if (password.length < 8) {
            errorMessage.textContent = 'Das Passwort muss mindestens 8 Zeichen lang sein.';
            errorMessage.style.display = 'block';
            return;
        }

        // Password must contain at least one symbol
        const symbolRegex = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/;
        if (!symbolRegex.test(password)) {
            errorMessage.textContent = 'Das Passwort muss mindestens ein Symbol enthalten (!@#$%^&*()_+-=[]{}|;:,.<>?).';
            errorMessage.style.display = 'block';
            return;
        }

        // Passwords must match
        if (password !== confirmPassword) {
            errorMessage.textContent = 'Passwörter stimmen nicht überein.';
            errorMessage.style.display = 'block';
            return;
        }
        // Gather registration data
        const userData = {
            username: document.getElementById('username').value,
            password: password,
            course_id: document.getElementById('course').value,
            role: "student" // 
            

        };

        // Send registration data to backend
        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(userData)
            });

            const data = await response.json();

            if (!response.ok) {
                errorMessage.textContent = data.detail || 'Registrierung fehlgeschlagen. Bitte versuchen Sie es erneut.';
                errorMessage.style.display = 'block';
                return;
            }

            window.location.href = '/login?registered=true';

        } catch (error) {
            errorMessage.textContent = 'Ein Fehler ist aufgetreten. Bitte versuchen Sie es erneut.';
            errorMessage.style.display = 'block';
            console.error('Registrierungsfehler:', error);
        }
    });
</script>
{% endblock %}
