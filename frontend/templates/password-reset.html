{% extends "base.html" %}
 
{% block title %}
Passwort zurücksetzen - Vorlesungschatbot
{% endblock %}
 
{% block content %}
<div class="password-reset">
  <h2>Passwort zurücksetzen</h2>
  
  <form id="resetForm">
    <div class="form-group">
      <label>Benutzername</label>
      <input type="text" id="username" required>
    </div>
    
    <div class="form-group">
      <label>Sicherheitsfrage 1: Was ist der Name deines ersten Haustiers?</label>
      <input type="text" id="answer1" required>
    </div>
    
    <div class="form-group">
      <label>Sicherheitsfrage 2: In welcher Stadt bist du geboren?</label>
      <input type="text" id="answer2" required>
    </div>
    
    <div class="form-group">
      <label>Sicherheitsfrage 3: Wie lautet der Mädchenname deiner Mutter?</label>
      <input type="text" id="answer3" required>
    </div>
    
    <div class="form-group">
      <label>Neues Passwort</label>
      <input type="password" id="newPassword" required>
    </div>
    
    <div class="form-group">
      <label>Passwort bestätigen</label>
      <input type="password" id="confirmPassword" required>
    </div>
    
    <div id="error" class="error-message"></div>
    <div id="success" class="success-message"></div>
    
    <button type="submit">Passwort zurücksetzen</button>
  </form>
</div>

<script>
  document.getElementById('resetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const username = document.getElementById('username').value;
    const answer1 = document.getElementById('answer1').value;
    const answer2 = document.getElementById('answer2').value;
    const answer3 = document.getElementById('answer3').value;
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    
    const errorDiv = document.getElementById('error');
    const successDiv = document.getElementById('success');
    
    errorDiv.textContent = '';
    successDiv.textContent = '';
    
    // Check if passwords match
    if (newPassword !== confirmPassword) {
      errorDiv.textContent = 'Die Passwörter stimmen nicht überein.';
      return;
    }
    
    try {
      const response = await fetch('/api/password-reset', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          username: username,
          answers: [answer1, answer2, answer3],
          new_password: newPassword
        })
      });
      
      const data = await response.json();
      
      if (!response.ok) {
        errorDiv.textContent = data.detail || 'Ein Fehler ist aufgetreten.';
        return;
      }
      
      successDiv.textContent = 'Passwort erfolgreich zurückgesetzt!';
      // Optionally redirect to login page after a delay
      setTimeout(() => {
        window.location.href = '/login';
      }, 3000);
      
    } catch (error) {
      errorDiv.textContent = 'Ein Fehler ist aufgetreten.';
      console.error(error);
    }
  });
</script>
{% endblock %}
